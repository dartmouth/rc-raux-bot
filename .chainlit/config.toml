# ==============================================================================
# CHAINLIT CONFIGURATION - RAUX-BOT
# ==============================================================================

[project]
# Session Management
user_env = []
session_timeout = 3600                    # 1 hour connection timeout
user_session_timeout = 1296000            # 15 days user session
cache = false
allow_origins = ["*"]

# ==============================================================================
# FEATURES
# ==============================================================================

[features]
# Content Processing
unsafe_allow_html = false
latex = false

# User Experience
user_message_autoscroll = true
auto_tag_thread = true
edit_message = true

# File Upload Settings
[features.spontaneous_file_upload]
enabled = true
accept = ["*/*"]                          
max_files = 20
max_size_mb = 500

# Audio Configuration
[features.audio]
sample_rate = 24000

# MCP (Model Context Protocol) Settings
[features.mcp.sse]
enabled = true

[features.mcp.stdio]
enabled = true
allowed_executables = ["npx", "uvx"]

# ==============================================================================
# USER INTERFACE
# ==============================================================================

[UI]
# Basic Settings
name = "RAUX-bot"
default_theme = "light"
cot = "full"                              # Chain of Thought display mode

# Visual Assets
favicon = "/public/favicon.ico"
default_avatar_file_url = "/public/logo_light.png"
logo_file_url = "/public/logo_light.png"

# Customization
custom_css = "/public/green-theme.css"
alert_style = "classic"

# Disabled/Optional Settings (uncomment to use)
# layout = "wide"
# default_sidebar_state = "open"
# description = ""
# custom_js = "/public/"
# logo_file_url = ""

# ==============================================================================
# THEME CONFIGURATION - DARTMOUTH GREEN
# ==============================================================================

[UI.theme.light]
# Dartmouth Green Theme - Light Mode
primary = "#00693E"                       # Dartmouth Green
secondary = "#12312b"                     # Dartmouth Green Light
background = "#FFFFFF"                    # White
paper = "#F8F9FA"                        # Light Gray
surface = "#FFFFFF"                      # White
textPrimary = "#00693E"                  # Dartmouth Green
textSecondary = "#12312b"                # Dartmouth Green Light

# Standard System Colors
error = "#D32F2F"
warning = "#F57C00"
info = "#1976D2"
success = "#00693E"                      # Dartmouth Green

[UI.theme.dark]
# Dartmouth Green Theme - Dark Mode
primary = "#12312b"                      # Dartmouth Green Light
secondary = "#00693E"                    # Dartmouth Green
background = "#424141"                   # Dark Gray
paper = "#1E1E1E"                       # Darker Gray
surface = "#424242"                     # Medium Gray
textPrimary = "#FFFFFF"                 # White
textSecondary = "#12312b"               # Dartmouth Green Light

# Standard System Colors
error = "#F44336"
warning = "#FF9800"
info = "#2196F3"
success = "#00693E"                     # Dartmouth Green

